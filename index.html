<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>sastimasti →</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>


<header class="site-header">

    <div class="container header-inner">

        <a
            href="index.html"
            class="logo"
        >
            <span>sastimasti</span>
            <span class="logo-arrow">→</span>
        </a>


        <div class="header-actions">

            <a
                href="manage.html"
                class="header-link"
            >
                My Ride
            </a>


            <a
                href="offer.html"
                class="btn btn-primary"
            >
                Offer a Ride →
            </a>

        </div>

    </div>

</header>



<main>


    <section class="hero">

        <div class="container hero-inner">

            <h1>
                Going alone?<br>
                Why?
            </h1>


            <div class="hero-actions">

                <a
                    href="#ridesList"
                    class="btn btn-primary btn-large"
                >
                    Carpool →
                </a>

            </div>

        </div>

    </section>



    <section class="rides-section">

        <div class="container">


            <div class="section-heading">

                <p class="section-eyebrow">
                    THE RIDE BOARD
                </p>


                <h2>
                    Who's going where?
                </h2>


                <p>
                    Find someone going your way.
                </p>

            </div>


            <div
                id="ridesList"
                class="rides-list"
            >

                <div class="loading-message">
                    Loading rides...
                </div>

            </div>


        </div>

    </section>


</main>



<footer>

    <div class="container footer-inner">


        <div class="footer-left">

            <div class="footer-brand">
                sastimasti →
            </div>


            <div class="footer-credit">
                Built by Tanishq
            </div>

        </div>



        <div class="footer-links">

            <a
                href="offer.html"
                class="footer-link"
            >
                Offer a Ride
            </a>


            <a
                href="manage.html"
                class="footer-link"
            >
                My Ride
            </a>


            <a
                href="help.html"
                class="footer-link"
            >
                Help &amp; feedback
            </a>

        </div>


    </div>

</footer>



<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script src="script.js?v=16"></script>


</body>

</html>
